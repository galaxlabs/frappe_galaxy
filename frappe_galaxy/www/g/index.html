{% extends "templates/web.html" %}
{% block page_content %}
<h1>Galaxy Guides</h1>

<ul>
  {% for it in items %}
    <li style="margin: 12px 0;">
      <a href="/{{ it.route }}">{{ it.title }}</a>
      <!-- <a href="/g/{{ it.slug }}">{{ it.title }}</a> -->
      <div style="opacity:.75">{{ it.content_type }}{% if it.summary %} — {{ it.summary }}{% endif %}</div>
    </li>
  {% endfor %}
</ul>
{% endblock %}
